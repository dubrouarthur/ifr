<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#eef1f5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ground school" />
    <meta name="description" content="%BRAND_TAGLINE_EN%: courses for aeroclubs and flight schools, from LAPL and PPL to IR and ATPL theory. Designed slides with live instruments, calculation exercises and quizzes, taught in class and then flown in the built-in simulator." />
    <title>Courses — %BRAND_NAME%</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..600&family=Roboto+Condensed:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; height: 100%; background: #eef1f5; }
      #academy { height: 100%; }
      /* the first frame, before the app draws (replaced by the router): the page's header and a quiet loading line,
         never a blank page */
      .ga-boot { height: 100%; display: flex; flex-direction: column; font: 600 16px/1 Inter, system-ui, sans-serif; color: #17202b; }
      .ga-boot-top { height: 56px; flex: none; display: flex; align-items: center; padding: 0 20px; background: #fff; border-bottom: 1px solid #dfe4ea; }
      .ga-boot-line { margin: 30vh auto 0; width: 160px; height: 3px; border-radius: 2px; background: #dfe4ea; overflow: hidden; }
      .ga-boot-line i { display: block; width: 40%; height: 100%; background: #1d5fd1; animation: ga-boot 1.1s ease-in-out infinite; }
      @keyframes ga-boot { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .ga-boot-line i { animation: none; } }
    </style>
  </head>
  <body>
    <div id="academy"><div class="ga-boot" aria-hidden="true"><div class="ga-boot-top">%BRAND_NAME%</div><div class="ga-boot-line"><i></i></div></div></div>
    <noscript>Ground school needs JavaScript.</noscript>
    <script type="module" src="/src/learn/main.ts"></script>
  </body>
</html>
